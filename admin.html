<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>kuhaku 메시지함</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2228%22 fill=%22%23fff1a8%22 stroke=%22%234a3550%22 stroke-width=%225%22/%3E%3Ccircle cx=%2223%22 cy=%2228%22 r=%223.5%22 fill=%22%234a3550%22/%3E%3Ccircle cx=%2241%22 cy=%2228%22 r=%223.5%22 fill=%22%234a3550%22/%3E%3Cellipse cx=%2216%22 cy=%2236%22 rx=%225%22 ry=%223.5%22 fill=%22%23ffb3d1%22/%3E%3Cellipse cx=%2248%22 cy=%2236%22 rx=%225%22 ry=%223.5%22 fill=%22%23ffb3d1%22/%3E%3Cpath d=%22M26 37a6 6 0 0 0 12 0%22 fill=%22none%22 stroke=%22%234a3550%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Baloo+2:wght@600&family=Nunito:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="admin">
  <h1>kuhaku 메시지함</h1>

  <!-- 로그인 전 / 설정 안내 -->
  <section class="panel" id="gate">
    <p id="gateText">불러오는 중…</p>
    <div id="uidBox" hidden>
      <p>내 사용자 ID (복사해서 <code>js/firebase-config.js</code> 의 <code>OWNER_UID</code> 와 <code>firestore.rules</code> 에 넣어요):</p>
      <p class="uid" id="uid"></p>
    </div>
    <button class="pill-btn" id="loginBtn" type="button" hidden>Google로 로그인</button>
  </section>

  <!-- 주인 전용 메시지함 -->
  <section class="inbox" id="inbox" hidden>
    <div class="panel">
      <p class="muted" id="threadCount">대화 0개</p>
      <ul class="threads" id="threads"></ul>
    </div>
    <div class="panel">
      <div class="thread-head">
        <p class="muted" id="threadTitle">왼쪽에서 대화를 골라 주세요.</p>
        <div class="thread-actions" id="threadActions" hidden>
          <button class="small-btn" id="blockBtn" type="button">차단하기</button>
          <button class="small-btn danger" id="deleteBtn" type="button">대화 지우기</button>
        </div>
      </div>
      <div class="chat-body" id="adminBody"></div>
      <form class="chat-form" id="replyForm" autocomplete="off">
        <input id="replyInput" type="text" maxlength="500" placeholder="답장 입력…" aria-label="답장" disabled>
        <button type="submit" id="replyBtn" disabled>보내기</button>
      </form>
    </div>
  </section>

  <button class="pill-btn ghost" id="logoutBtn" type="button" hidden>로그아웃</button>
</main>

<script type="module" src="js/admin.js"></script>
</body>
</html>
